<aside class="sb" aria-label="Navegación principal">
  <nav>
    <ul class="nav-list">
      <li *ngFor="let item of items">
        <a
          class="nav-a"
          [class.nav-sub]="item.sub"
          [routerLink]="item.route"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          (click)="navigated.emit()"
        >
          <mat-icon *ngIf="item.icon" class="nav-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sb-foot">
    <a
      class="nav-a"
      [routerLink]="footItem.route"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
      (click)="navigated.emit()"
    >
      <mat-icon class="nav-icon" aria-hidden="true">{{ footItem.icon }}</mat-icon>
      <span>{{ footItem.label }}</span>
    </a>
  </div>
</aside>
