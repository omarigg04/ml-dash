<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>MercadoLibre Dashboard</h1>
      <p>Inicia sesión con tu cuenta de MercadoLibre</p>
    </div>

    <div class="login-form">
      <!-- Error Message -->
      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <!-- Login Button -->
      <button
        type="button"
        class="login-btn"
        (click)="onLogin()"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Entrar con Mercado Libre</span>
        <span *ngIf="isLoading">Redirigiendo...</span>
      </button>
    </div>
  </div>
</div>
