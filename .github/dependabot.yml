version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors are planned migrations, not routine bumps (security updates still arrive separately)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zone.js"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
